<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedula</title>
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <!-- CSS tambahan -->
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <div class="app-shell">

    <!-- SIDEBAR (di layar kecil menjadi menu geser / offcanvas) -->
    <aside class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="sidebar" aria-label="Menu utama">
      <div class="offcanvas-body">
        <button type="button" class="btn-close btn-close-white d-lg-none sidebar-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Tutup"></button>

        <a class="sidebar-brand d-flex align-items-center gap-2 text-white text-decoration-none fw-bold fs-5" href="#/">
          <img src="logo.png" alt="Logo" height="32">Schedula
        </a>

        <nav class="d-flex flex-column gap-1">
          <a class="side-link" data-r="" href="#/"><i class="bi bi-house-door"></i> Beranda</a>

          <div class="side-label" data-auth>Menu</div>
          <a class="side-link" data-auth data-r="dashboard" href="#/dashboard"><i class="bi bi-speedometer2"></i> Dashboard</a>
          <a class="side-link" data-auth data-r="matkul" href="#/matkul"><i class="bi bi-journal-bookmark"></i> Mata Kuliah</a>
          <a class="side-link" data-auth data-r="tugas" href="#/tugas"><i class="bi bi-list-check"></i> Tugas</a>
          <a class="side-link" data-auth data-r="jadwal" href="#/jadwal"><i class="bi bi-calendar-week"></i> Jadwal</a>
          <a class="side-link" data-auth data-r="rekap" href="#/rekap"><i class="bi bi-bar-chart-line"></i> Rekap</a>

          <div class="side-label" data-auth>Akun</div>
          <a class="side-link" data-auth data-r="notifikasi" href="#/notifikasi"><i class="bi bi-bell"></i> Notifikasi
            <span class="badge rounded-pill text-bg-danger ms-auto d-none" id="nbadge"></span></a>
          <a class="side-link" data-auth data-r="profil" href="#/profil"><i class="bi bi-person-circle"></i> Profil</a>
        </nav>

        <!-- Area akun: diisi script.js (kartu pengguna + tombol keluar, atau tombol Masuk / Daftar) -->
        <div id="sideUser" class="mt-auto pt-3"></div>
      </div>
    </aside>

    <div class="app-main d-flex flex-column min-vh-100">

      <!-- TOPBAR (hanya tampil di layar kecil) -->
      <header class="topbar d-lg-none sticky-top bg-dark d-flex align-items-center gap-3 px-3 py-2">
        <button class="btn btn-outline-light btn-sm" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar" aria-controls="sidebar" aria-label="Buka menu">
          <i class="bi bi-list fs-5"></i>
        </button>
        <a class="d-flex align-items-center gap-2 text-white text-decoration-none fw-bold me-auto" href="#/">
          <img src="logo.png" alt="Logo" height="28">Schedula
        </a>
        <a data-auth href="#/notifikasi" class="text-white fs-5 position-relative" aria-label="Notifikasi">
          <i class="bi bi-bell"></i>
          <span class="badge rounded-pill text-bg-danger position-absolute top-0 start-100 translate-middle d-none" id="nbadge2"></span>
        </a>
      </header>

      <!-- KONTEN HALAMAN -->
      <main id="app" class="flex-grow-1"></main>

      <!-- FOOTER -->
      <footer class="bg-dark text-secondary text-center py-4 mt-auto">
        <small>&copy; 2026 Schedula - Aplikasi Daftar Tugas dan Jadwal Belajar Mahasiswa</small>
      </footer>
    </div>
  </div>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>

  <!-- Bootstrap JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
